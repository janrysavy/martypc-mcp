name: Debugger
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: debugger-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debugger:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Install Linux serial enumeration dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libudev-dev
      - name: Test native CPU, devices and RPC transport
        run: cargo test -p marty_debug_rpc -p marty_config -p martypc_headless --no-default-features --lib --locked
      - name: Build headless debugger
        run: cargo build -p martypc_headless --no-default-features --locked
      - name: Build native observation UI
        if: runner.os == 'Windows'
        run: cargo build -p martypc_eframe --locked
