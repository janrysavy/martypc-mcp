name: Debugger
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_only:
        description: Build an authenticated Windows release artifact only
        type: boolean
        default: false
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.98.0
concurrency:
  group: debugger-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.release_only || false }}
  cancel-in-progress: true
jobs:
  debugger:
    if: github.event_name != 'workflow_dispatch' || !inputs.release_only
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Run37286467609 reached the 30-minute limit during the cold Windows UI
    # build after earlier gates passed. Keep all checks; allow them to finish.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Test release artifact provenance and refusal guards
        run: python -B util/test_windows_release.py
      - name: Install Linux serial enumeration dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libudev-dev
      - name: Prove PIT odd/even reload regression and restored positive
        run: python util/test_pit_reload_regression.py
      - name: Test native CPU, devices and RPC transport
        run: cargo test -p marty_debug_rpc -p marty_config -p martypc_headless --no-default-features --lib --locked
      - name: Build headless debugger
        run: cargo build -p martypc_headless --no-default-features --locked
      - name: Test frontend timing and bounded RPC catchup
        run: cargo test -p marty_frontend_common --no-default-features --lib --locked
      - name: Test core snapshot component and service paths
        run: cargo test -p marty_core --no-default-features --lib --locked
      - name: Test VGA text rendering and complete video snapshots
        run: cargo test -p marty_core --no-default-features --features vga,ega --lib --locked
      - name: Test serial bridge and configured speaker snapshot paths
        run: cargo test -p marty_core --no-default-features --features serial,sound --lib --locked
      - name: Build native observation UI
        if: runner.os == 'Windows'
        run: cargo build -p martypc_eframe --locked
      - name: Test native GUI snapshot factory and refusal guards
        if: runner.os == 'Windows'
        run: cargo test -p martypc_eframe --lib --locked

  windows-release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_only
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Materialize exact Git source bytes
        shell: pwsh
        run: |
          git config core.autocrlf false
          git -c core.eol=lf checkout-index --all --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test release provenance guards
        run: python -B util/test_windows_release.py
      - name: Build and authenticate fresh release
        run: python -B util/windows_release.py --out .ci-release/artifact
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.sha }}
          path: |
            .ci-release/artifact/martypc.exe
            .ci-release/artifact/receipt.json
            .ci-release/artifact/LICENSE
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
