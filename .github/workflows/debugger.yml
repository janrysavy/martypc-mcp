name: Debugger
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: debugger-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debugger:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Test native CPU, devices and RPC transport
        run: cargo test -p martypc_headless --no-default-features --lib --locked
      - name: Build headless debugger
        run: cargo build -p martypc_headless --no-default-features --locked
